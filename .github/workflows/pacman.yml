name: Update Pac-Man Contributions

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pacman.yml
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: acetoleza12
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
